name: Windows Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Conan
      run: |
        pip install conan

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1

    - name: Detect Conan profile
      run: |
        conan profile detect --force

    - name: Install dependencies
      run: |
        conan install . --build=missing -s build_type=Release -s compiler.cppstd=17

    - name: Configure CMake
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: |
        cmake --preset conan-default

    - name: Build
      run: |
        cmake --build --preset conan-release --config Release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tempus-windows
        path: |
          build/Release/tempus.exe

    - name: Upload to release
      if: github.event_name == 'release'
      run: |
        mv build/Release/tempus.exe build/Release/tempus-windows-x64.exe
        gh release upload ${{ github.ref_name }} build/Release/tempus-windows-x64.exe
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
