name: Linux Build

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          cmake \
          pkg-config \
          python3-pip \
          libayatana-appindicator3-dev \
          libgtk-3-dev \
          libsecret-1-dev \
          libgl1-mesa-dev \
          libglu1-mesa-dev \
          xorg-dev

    - name: Install Conan
      run: |
        pip3 install conan
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Detect Conan profile
      run: |
        conan profile detect --force

    - name: Install dependencies
      run: |
        conan install . --build=missing -s build_type=Release -c tools.system.package_manager:mode=install -c tools.system.package_manager:sudo=True

    - name: Configure CMake
      env:
        RELEASE_VERSION: ${{ github.ref_name }}
      run: |
        cmake --preset conan-release

    - name: Build
      run: |
        cmake --build --preset conan-release

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: tempus-linux
        path: |
          build/Release/tempus

    - name: Upload to release
      if: github.event_name == 'release'
      run: |
        mv build/Release/tempus build/Release/tempus-linux-x64
        gh release upload ${{ github.ref_name }} build/Release/tempus-linux-x64
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
